# A synthetic profile/v1 instance — and a VALID one.
#
# It speaks `tool/v1` ToolIds, because that is the only thing a profile can
# speak: it comes from the platform, which has never heard of this registry's
# internal names. `time.now` is what `current_time` is called on the wire
# (`builder/tool-ids.ts`), and the ceiling is applied in that vocabulary.
#
# It used to use internal names and therefore did not validate — that was the
# gap #59 was opened about, and closing it is what let this repo pin
# `tool/v1` and `agent/v1`.
profile_id: narrow-reviewer
display_name: Narrow Reviewer
description: >-
  A ceiling that allows reading and commenting, denies merging outright, and
  wants a human on every comment.

capability_requirement:
  required:
    - github
  preferred:
    - long_context

tools:
  allow:
    - github.read
    - github.comment
    - time.now
  deny:
    - github.merge

policy:
  authority_map:
    low: auto
    medium: approval_required
    high: human_command_required
    critical: human_command_required
  deny_capabilities:
    - shell
  require_human_for:
    - github.comment
