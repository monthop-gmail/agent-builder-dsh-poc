$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.agent-platform.internal/tool/v1/tool.schema.yaml
title: Tool
description: >-
  ทุก capability ที่ agent เรียกใช้ได้ต้องเป็น tool ที่ประกาศไว้
  agent discover tool ได้เองผ่าน registry/MCP แต่ **เรียกได้ต่อเมื่อ policy อนุญาต**

$defs:
  ToolId:
    type: string
    pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
    description: >-
      namespace ด้วยจุด เช่น `github.issue.create` `odoo.sale.read` `knowledge.search`
      ส่วนแรกคือ domain ส่วนท้ายคือ action — อ่านแล้วต้องเดาผลกระทบได้

type: object
required: [tool_id, description, input_schema, action_risk]
properties:
  tool_id:
    $ref: '#/$defs/ToolId'
  description:
    type: string
    description: เขียนให้ model อ่านเข้าใจว่าใช้เมื่อไหร่ ไม่ใช่แค่ว่ามันทำอะไร
  input_schema:
    type: object
    description: JSON Schema ของ argument
  output_schema:
    type: object
  action_risk:
    $ref: https://schemas.agent-platform.internal/capability/v1/capability.schema.yaml#/$defs/ActionRisk
    description: >-
      ความเสี่ยงของ action นี้ (ADR-0010) — **ไม่ใช่** ระดับการอนุมัติ
      การตัดสินว่าต้องอนุมัติหรือไม่เป็นหน้าที่ของ policy/v1 ซึ่งดูทั้ง tenant และ profile ประกอบ
      ฟิลด์เดิมชื่อ `risk_level` ในเอกสารเก่า — เลิกใช้แล้ว
  required_capabilities:
    type: array
    description: capability ที่ subject ต้องมีจึงจะเรียก tool นี้ได้
    items:
      $ref: https://schemas.agent-platform.internal/capability/v1/capability.schema.yaml#/$defs/CapabilityId
  permission:
    type: string
    description: ชื่อสิทธิ์ที่ policy ใช้อ้าง เช่น `github:write`
  timeout_seconds:
    type: integer
    minimum: 1
    default: 60
  idempotent:
    type: boolean
    default: false
    description: >-
      ถ้า false platform จะไม่ retry อัตโนมัติหลัง timeout เพราะอาจทำซ้ำของจริง
      ดู execution/v1 เรื่อง retry semantics
  audit:
    type: boolean
    default: true
    description: ตั้งเป็น false ได้เฉพาะ tool ที่อ่านอย่างเดียวและไม่แตะข้อมูลส่วนบุคคล
  deprecated:
    type: boolean
    default: false

platform_rules:
  description: >-
    กฎระดับ schema ที่ `agent-platform` เพิ่มเอง — ไม่ใช่ semantics ของ tool แต่ละตัว
  rules:
    - "ชื่อภายในของ registry กับ `ToolId` บน wire **ไม่จำเป็นต้องเป็นชื่อเดียวกัน**
       (ADR-0027) — registry เก็บ `calculator` ต่อไปได้ ส่วนชื่อที่ประกาศออกมาเป็น
       `math.evaluate` โดย map ที่ขอบเขตเดียว · แบบเดียวกับที่ devfactory-core map
       supersedes_decision_id → supersedes_approval_id ที่ decision.WIRE_FIELD_NAMES"
    - "การแปลงชื่อจาก server ภายนอกเป็น `ToolId` **ต้อง deterministic** — ถ้าแต่ละ
       consumer แปลงเอง tool ตัวเดียวกันจะมี ToolId คนละชุด แล้วเพดานเชิงชื่อของ
       profile จะคุ้มรายหนึ่งแต่ไม่คุ้มอีกราย ซึ่งทำลายฐานของ ADR-0026
       ขั้นตอน: (1) lowercase (2) อักขระนอก [a-z0-9_] เป็น `_` ทีละตัว **ห้ามยุบซ้ำ**
       เพราะการยุบสร้างการชนเพิ่มโดยไม่จำเป็น และ `a__b` ถูกต้องตาม pattern อยู่แล้ว
       (3) เติม segment ของ namespace ไว้หน้า — สำหรับ MCP คือ `server_id`"
    - "ถ้าแปลงแล้วยังไม่ match `ToolId` (เช่นชื่อขึ้นต้นด้วยตัวเลข `2fa_setup`)
       → **reject แล้วบังคับ mapping ที่เขียนมือ ห้ามเดา prefix ให้** — การเดาทำให้ผล
       ไม่ deterministic ข้าม implementation ซึ่งย้อนแย้งกับเหตุผลของกฎข้อบน"
    - "ถ้าแปลงแล้ว **ชนกัน** → **reject ไม่ใช่เลือกอันใดอันหนึ่ง** — การชนเกิดจากการแปลง
       ของเราเอง ไม่ใช่ความผิดของ server · ปล่อยเงียบแปลว่า tool คนละตัวอยู่หลัง id
       เดียวกัน และ policy ที่เขียนถึงตัวหนึ่งจะไปคุมอีกตัวโดยไม่มีใครรู้
       (หลักเดียวกับ consent/v1 tenant mismatch และ ADR-0022 required ∩ deny)"
    - "**การแปลงต้องย้อนกลับได้** — ผู้ที่ขึ้นทะเบียน tool จาก server ภายนอกต้องเก็บ
       ชื่อเดิมไว้ให้ audit ตามกลับไปได้ · รูปกลางของบันทึกนั้นรอ consumer รายแรกที่
       pin `mcp/v1` (ADR-0027 · เหตุผลเดียวกับที่ ADR-0025 ไม่สร้าง field ให้ cost)"
    - "`ToolId` unique ภายใน **tenant** ไม่ใช่ทั้งโลก — `server_id` ที่ใช้เป็น namespace
       ก็ unique ภายใน tenant/workspace เหมือนกัน ขอบเขตจึงตรงกัน"
