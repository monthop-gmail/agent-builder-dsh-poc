# Consumer manifest — ประกาศว่า repo นี้ยึด contract อะไรของ agent-platform
#
# รูปแบบตาม ADR-0006:
#   https://github.com/monthop-gmail/agent-platform/blob/main/decisions/0006-contract-versioning.md
#
# repo นี้เป็น **ผู้บริโภค contract และผู้ผลิต execution record** — Builder อ่าน
# `profile/v1` เป็นเพดาน ใช้ taxonomy ของ `capability/v1` และปล่อย record ที่มีรูปตาม
# `execution/v1` เมื่อ runtime ย้าย provider กลางรอบ

platform_contract_version: "0.1"

contracts:
  - agent/v1         # record ที่ Builder ปล่อยได้จาก manifest — validate ทุกใบใน compatibility set
  - tool/v1          # `ToolId` บน wire · map จากชื่อภายในที่ builder/tool-ids.ts จุดเดียว
  - capability/v1    # taxonomy 14 ค่า + canonical_scope ที่ tool และ manifest ใช้เรียกความสามารถ
  - profile/v1       # เพดานที่ `--profile` รับเข้ามา แล้วรวมกับ policy ของ agent
  - execution/v1     # `provider_switches` + `provider_id` จากการรันจริง
  - identity/v1      # รูปของ id และ `ExecutionContext` ในทุก record ที่ปล่อย

conformance:
  status: passing
  last_verified: 2026-09-03

  # ADR-0006 บังคับ consumer 3 ข้อ
  #   1. manifest         ไฟล์นี้
  #   2. conformance test conformance/payload-check.ts — **ผลิต payload จากการรันจริง**
  #                       execution record มาจากการรัน openai-compatible runtime กับ
  #                       stub ที่ถูกบังคับให้ตอบ 503 การย้าย provider ที่ถูกบันทึก
  #                       จึงเป็นการย้ายที่เกิดขึ้นจริง ไม่มี fixture ที่เขียนขึ้นเพื่อให้ผ่าน
  #   3. release gate     ruleset `release gate — main` · required checks
  #                       `tests — vitest + typecheck` และ `conformance — ADR-0006`
  #                       · bypass_actors: 0 · ห้าม force push · ต้องผ่าน PR
  #                       (รูปแบบเดียวกับ botforge ไม่ใช่ legacy branch protection)

pinned_contracts_commit: 6cb0b795988d6b0b353929b0f028309b4c0d7838   # conformance/pinned.yaml

# ─────────────────────────────────────────────────────────────────────────────
# สิ่งที่ **ไม่** pin และเหตุผล
#
# ADR-0006 บอกให้ประกาศเฉพาะที่ใช้จริง และหลักที่ทีมย้ำไว้ตั้งแต่ต้นคือ
# **อย่าประกาศ conformance ถ้ายังไม่มี CI ที่ validate payload จริง** — ข้อนี้เป็น
# ด้านกลับของหลักเดียวกัน: อย่าประกาศว่า conform กับ contract ที่เรายังไม่ผ่าน
# ─────────────────────────────────────────────────────────────────────────────

not_pinned:
  model/v1:
    reason: >-
      ทำตาม `platform_rules` ทั้งสามข้อแล้ว (binding มาจาก capability requirement ·
      requirement ยังเป็นแหล่งความจริง · `buildIdentity` ครอบทั้งโซ่รวมลำดับ)
      แต่ **ไม่มี payload ของ `model/v1` ที่เราปล่อยออกมาให้ validate** — adapter คุยกับ
      endpoint ที่เป็น OpenAI-compatible ไม่ใช่รูปของ `Request`/`Response` ในสัญญานี้
      การ pin จึงจะเป็นการประกาศสิ่งที่ CI พิสูจน์ไม่ได้
  policy/v1:
    reason: >-
      vendor schema ไว้เพราะ `profile/v1` `$ref` ไปหา `Authority` แต่ repo นี้ยังไม่ได้
      ผลิต `Decision` record ออกมา — Builder หักสิทธิ์ที่ compile time ไม่ได้ประเมิน
      policy ต่อ action ตอนรัน

# ─────────────────────────────────────────────────────────────────────────────
# ช่องว่างที่รู้แล้ว — วัดทุกรอบ ไม่ได้ปล่อยผ่าน
# ─────────────────────────────────────────────────────────────────────────────

known_gaps:
  - id: no-tenancy-in-manifest
    what: >-
      `agent/v1alpha2` ไม่มี `tenant_id` / `workspace_id` เลย ทั้งที่ ADR-0007 บังคับ
      ฝั่ง platform — conformance จึงต้องป้อนค่าจากภายนอกเวลาสร้าง record
    note: >-
      แผลเดียวกับที่ `devfactory-core` เจอตอนนำร่อง (RFC-0006) · ยังไม่แก้เพราะ manifest
      freeze อยู่ และการเพิ่ม required field เป็น breaking

# ─────────────────────────────────────────────────────────────────────────────
# ปิดไปแล้ว
# ─────────────────────────────────────────────────────────────────────────────

closed_gaps:
  - id: bare-tool-names
    was: >-
      `calculator` `current_time` `web_search` ไม่ใช่ `ToolId` ที่ถูกต้อง จึง pin
      `agent/v1` และ `tool/v1` ไม่ได้ · เคยประเมินว่าต้อง bump `agent/v1alpha2`
    closed_by: >-
      [#59](https://github.com/monthop-gmail/agent-platform/issues/59) option A — ชื่อภายใน
      กับชื่อบน wire ไม่ต้องเป็นชื่อเดียวกัน · map ที่ `builder/tool-ids.ts` จุดเดียว
      **ไม่ต้อง bump manifest เลย** เพราะไม่มีอะไรที่ผู้ใช้เขียนเปลี่ยน
    note: >-
      ระหว่างทางพบว่าการเติม namespace อย่างเดียวไม่พอ — probe MCP server จริงสองตัว
      (29/29 ชื่อเปล่า) และเจอ server ที่ใช้ kebab-case กับ SCREAMING_SNAKE ซึ่ง
      character class ของ `ToolId` ปฏิเสธด้วย · mapping จึงต้อง sanitize และ
      **ชนกันแล้ว reject ไม่ใช่เลือกอันใดอันหนึ่งเงียบ ๆ** · รายงานไว้ใน #59 แล้ว

# ─────────────────────────────────────────────────────────────────────────────
# ที่ยังไม่มีคำตอบจาก platform
# ─────────────────────────────────────────────────────────────────────────────

open_questions:
  - question: >-
      ถ้า consumer ต้อง sanitize ชื่อ MCP เอง กฎการแปลงควรอยู่ใน `tool/v1` ไหม —
      สอง consumer ที่ต่อ server เดียวกันอาจได้ `ToolId` คนละชุด ซึ่งทำลายสมมติฐาน
      ที่ ADR-0026 พึ่งอยู่
    asked_at: https://github.com/monthop-gmail/agent-platform/issues/59
    status: รอ decision
  - question: consumer pin ไฟล์ใน `profiles/` ได้ไหม หรือเป็นแค่ตัวอย่าง
    asked_at: https://github.com/monthop-gmail/agent-platform/issues/47
    status: ยังไม่มีคำตอบ
    workaround: >-
      `--profile` รับ path ที่ผู้เรียกส่งมา **เราไม่ได้ pin ไฟล์ profile ใด ๆ**
      ไฟล์ใน tests/fixtures/platform/ เป็น fixture ที่ vendor มาพร้อมเลข commit
