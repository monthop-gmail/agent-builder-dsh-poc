# release gate — ADR-0006 requirement 3
#
# `conformance` is the job that has to be a required check in branch
# protection. This file cannot enforce that; it is a repo setting, and
# platform-contract.yaml says so rather than implying the file is enough.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Check names are the string branch protection matches on, so they are
    # written for the person reading a blocked PR, not for the YAML key.
    # `conformance — ADR-0006` is deliberately the SAME string botforge uses:
    # one name across the ecosystem means one thing to look for.
    name: tests — vitest + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  conformance:
    # ADR-0006: validate real payloads against the pinned schemas, every PR.
    name: conformance — ADR-0006
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run conformance

  drift:
    # Kept OUT of the gate on purpose: it needs the network, and a red build
    # caused by GitHub being slow teaches people to stop believing red.
    # `continue-on-error` makes it a signal, not a blocker — and the name says
    # so, because a check nobody can interpret is a check nobody acts on.
    name: schema drift — advisory, not a gate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run conformance:drift
