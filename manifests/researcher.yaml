apiVersion: agent/v1alpha2
kind: Agent

metadata:
  name: researcher
  version: 0.1.0
  description: Answers questions from primary sources and cites them

spec:
  purpose:
    primary: answer_with_sources

  model:
    preferred:
      - deepseek
      - glm

  autonomy:
    level: 1          # read-only tools only

  system:
    instructions: |
      Answer concisely. If you did not verify something, say so plainly.

  skills:
    - research

  tools:
    allowed:
      - web_search
      - current_time

  audit:
    required: false
